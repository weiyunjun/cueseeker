<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CueSeeker · Liquid Glass v4</title>
  <style>
/*
  CueSeeker Liquid Glass v4 split-source prototype.
  Styles intentionally preserve v3 visual selectors. The additional ui-*
  classes in index.html provide the new component taxonomy without changing
  visual output.
*/

:root {
      color-scheme: light;

      /* Liquid Glass tokens */
      --glass-window-bg: rgba(244, 244, 247, 0.62);
      --glass-window-border: rgba(255, 255, 255, 0.55);
      --glass-window-shadow:
        0 0 0 0.5px rgba(0, 0, 0, 0.12),
        0 1px 0 rgba(255, 255, 255, 0.6) inset,
        0 30px 80px -20px rgba(20, 24, 40, 0.35),
        0 10px 30px -10px rgba(20, 24, 40, 0.18);

      --glass-hud-bg: rgba(248, 248, 250, 0.55);
      --glass-hud-border: rgba(255, 255, 255, 0.6);
      --glass-hud-shadow:
        0 0 0 0.5px rgba(0, 0, 0, 0.10),
        0 1px 0 rgba(255, 255, 255, 0.75) inset,
        0 -1px 0 rgba(255, 255, 255, 0.18) inset,
        0 18px 40px -14px rgba(15, 18, 30, 0.30),
        0 6px 16px -6px rgba(15, 18, 30, 0.18);

      --glass-thin-bg: rgba(255, 255, 255, 0.32);
      --glass-thin-border: rgba(255, 255, 255, 0.5);

      --hairline: rgba(0, 0, 0, 0.08);
      --hairline-soft: rgba(0, 0, 0, 0.05);
      --inner-top: rgba(255, 255, 255, 0.7);

      --text: #1a1a1f;
      --text-2: #4d4e55;
      --text-3: #7a7c84;
      --text-4: #adafb6;
      --pill-fg: var(--text);
      --search-page-bg: #ffffff;

      --accent: #0a84ff;
      --accent-soft: rgba(10, 132, 255, 0.16);
      --accent-soft-2: rgba(10, 132, 255, 0.28);
      --highlight: rgba(255, 204, 0, 0.42);
      --highlight-text: #4a3300;

      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--sf);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* Desktop — colorful enough that glass actually shows refraction */
    body {
      position: relative;
      background:
        radial-gradient(ellipse 60% 50% at 18% 22%, #ffd6a8 0%, transparent 60%),
        radial-gradient(ellipse 55% 60% at 82% 18%, #c8d4ff 0%, transparent 60%),
        radial-gradient(ellipse 70% 60% at 80% 88%, #ffc4d6 0%, transparent 55%),
        radial-gradient(ellipse 55% 60% at 14% 86%, #b6e4d0 0%, transparent 55%),
        linear-gradient(135deg, #e8e4dc 0%, #d8d6e0 50%, #cdd4dc 100%);
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 54px 28px 18px;
    }

    /* Subtle film grain over the whole desktop for that organic mac wallpaper feel */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        radial-gradient(circle at 30% 70%, rgba(255,255,255,0.4), transparent 40%),
        radial-gradient(circle at 70% 30%, rgba(255,255,255,0.25), transparent 40%);
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    button, input { font: inherit; }
    button { cursor: default; }

    /* ============================ WINDOW ============================ */
    .window {
      width: min(1380px, 100%);
      height: min(900px, calc(100vh - 72px));
      min-height: 520px;
      border-radius: 14px;
      background: var(--glass-window-bg);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      box-shadow: var(--glass-window-shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: 48px minmax(0, 1fr);
      position: relative;
    }

    /* Inner refraction edge — a soft inner ring of light */
    .window::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow:
        inset 0 0.5px 0 rgba(255, 255, 255, 0.7),
        inset 0 -0.5px 0 rgba(255, 255, 255, 0.18),
        inset 0.5px 0 0 rgba(255, 255, 255, 0.28),
        inset -0.5px 0 0 rgba(255, 255, 255, 0.28);
    }

    /* Tinted noise/blur veneer giving it the silver-gray sheen */
    .window::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 22%, transparent 78%, rgba(255,255,255,0.06) 100%);
      mix-blend-mode: screen;
    }

    /* ============================ TOOLBAR ============================ */
    .toolbar {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 14px;
      border-bottom: 0.5px solid rgba(0,0,0,0.06);
      background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0.10));
    }

    .traffic {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .traffic span {
      width: 12px; height: 12px;
      border-radius: 50%;
      box-shadow:
        inset 0 0.5px 0 rgba(255, 255, 255, 0.55),
        inset 0 0 0 0.5px rgba(0, 0, 0, 0.10),
        0 0 0 0.5px rgba(0,0,0,0.04);
    }
    .close { background: #ff5f57; }
    .minimize { background: #febc2e; }
    .zoom { background: #28c840; }

    .toolbar-center {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Tool buttons in toolbar — small glass pills on hover */
    .tool-button {
      appearance: none;
      border: 0;
      width: 30px; height: 26px;
      border-radius: 7px;
      background: transparent;
      color: rgba(0, 0, 0, 0.66);
      display: inline-flex;
      align-items: center; justify-content: center;
      transition: background 120ms ease, box-shadow 120ms ease;
    }
    .tool-button:hover {
      background: rgba(255,255,255,0.55);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.8),
        0 0 0 0.5px rgba(0,0,0,0.06);
    }
    .tool-button.selected {
      background: rgba(255,255,255,0.7);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.9),
        0 0 0 0.5px rgba(0,0,0,0.08),
        0 1px 2px rgba(0,0,0,0.06);
    }

    /* Search field — glass pill */
    .search-field {
      height: 30px;
      min-width: 380px;
      max-width: 540px;
      flex: 0 1 460px;
      margin-left: 6px;
      padding: 0 10px 0 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.55);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.9),
        inset 0 -0.5px 0 rgba(255,255,255,0.25),
        0 0 0 0.5px rgba(0,0,0,0.07),
        0 1px 2px rgba(0,0,0,0.04);
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      transition: box-shadow 140ms ease, background 140ms ease;
    }
    .search-field:focus-within {
      background: rgba(255,255,255,0.85);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,1),
        0 0 0 0.5px rgba(10,132,255,0.55),
        0 0 0 3.5px rgba(10,132,255,0.18);
    }
    .search-field svg { color: rgba(0,0,0,0.45); flex: 0 0 auto; }
    .search-field input {
      min-width: 0; flex: 1;
      height: 24px;
      border: 0; outline: 0; background: transparent;
      color: var(--text);
      font-size: 13.5px;
    }

    .clear-button {
      appearance: none; border: 0; background: transparent; padding: 0;
      color: rgba(0,0,0,0.42);
      display: inline-flex; align-items: center;
    }

    /* ============================ MAIN ============================ */
    .main {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    .search-state, .video-state {
      position: absolute;
      inset: 0;
      min-height: 0;
      transition: opacity 200ms ease;
    }

    .search-state {
      background: var(--search-page-bg);
      transition: opacity 200ms ease, background 220ms ease;
    }

    .video-state {
      display: grid;
      grid-template-columns: 1fr 380px;
      opacity: 0;
      pointer-events: none;
    }

    .window.video-expanded .search-state {
      opacity: 0;
      pointer-events: none;
    }
    .window.video-expanded .video-state {
      opacity: 1;
      pointer-events: auto;
    }

    /* ============================ SEARCH RESULTS ============================ */
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px 6px;
    }

    .results-header .summary {
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: var(--text-2);
      font-size: 12.5px;
    }
    .results-header strong {
      color: var(--text);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .header-actions { display: flex; gap: 4px; }

    .small-button {
      appearance: none;
      min-width: 92px;
      height: 26px;
      padding: 0 13px;
      border-radius: 999px;
      border: 0.5px solid var(--pill-border);
      background: var(--pill-bg);
      box-shadow: var(--pill-shadow);
      color: var(--pill-fg);
      font-size: 11.5px;
      transition: background 120ms ease, color 120ms ease, transform 160ms cubic-bezier(.34,1.56,.64,1);
    }
    .small-button:hover:enabled {
      background: var(--pill-hover-bg);
    }
    .small-button:active { transform: scale(0.94); }

    .results-scroll {
      position: absolute;
      left: 0; right: 0; top: 50px; bottom: 0;
      overflow: auto;
      padding: 4px 24px 120px; /* room for floating HUD */
    }

    .group {
      padding: 14px 0 6px;
      border-bottom: 0.5px solid var(--hairline-soft);
      margin-bottom: 6px;
    }
    .group:last-child { border-bottom: 0; }

    .group-header {
      appearance: none;
      border: 0;
      width: calc(100% + 12px);
      margin: 0 -6px;
      padding: 5px 8px 5px 4px;
      border-radius: 7px;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      transition: background 100ms ease;
    }
    .group-header:hover { background: rgba(255,255,255,0.4); }

    .group-header .chevron {
      width: 16px; height: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-3);
      transition: transform 160ms ease;
      transform: rotate(90deg);
    }
    .group.collapsed .chevron { transform: rotate(0deg); }
    .group-title {
      font-size: 13px; font-weight: 600; color: var(--text);
      letter-spacing: -0.005em;
    }
    .group-count {
      color: var(--text-3);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 10px;
      margin: 10px 0 14px;
    }
    .group.collapsed .cards { display: none; }

    /* Result card — thin glass tile */
    .result-card {
      appearance: none;
      position: relative;
      border: 0;
      border-radius: 10px;
      background: rgba(255,255,255,0.48);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.85),
        inset 0 -0.5px 0 rgba(255,255,255,0.18),
        0 0 0 0.5px rgba(0,0,0,0.06),
        0 1px 2px rgba(15,18,30,0.04);
      color: var(--text);
      text-align: left;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      user-select: text;
      transition: background 120ms ease, box-shadow 120ms ease, transform 120ms ease;
    }
    .result-card:hover {
      background: rgba(255,255,255,0.7);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.95),
        0 0 0 0.5px rgba(0,0,0,0.07),
        0 4px 12px -4px rgba(15,18,30,0.12);
    }
    .result-card.selected {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,1),
        inset 0 -0.5px 0 rgba(255,255,255,0.5),
        0 0 0 0.5px rgba(10,132,255,0.55),
        0 0 0 3px rgba(10,132,255,0.10),
        0 6px 18px -4px rgba(15,18,30,0.18);
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-3);
      font: 11px var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }
    .result-card.selected .meta,
    .sidebar-row.selected .meta {
      color: var(--accent);
      font-weight: 600;
    }

    .rank { display: inline-flex; align-items: center; gap: 5px; }
    .playing {
      color: var(--accent);
      display: none;
      width: 8px; height: 8px;
      flex: 0 0 auto;
    }
    .selected .playing { display: inline-flex; }

    .line {
      color: var(--text);
      font-size: 13.5px;
      font-weight: 450;
      line-height: 1.4;
      opacity: 0.86;
      text-wrap: pretty;
    }
    .selected .line {
      color: #0a1426;
      font-weight: 600;
      opacity: 1;
    }
    .result-card.selected .meta,
    .sidebar-row.selected .meta {
      color: var(--accent);
      font-weight: 600;
    }

    mark {
      background: var(--highlight);
      color: var(--highlight-text);
      padding: 1px 3px;
      border-radius: 3px;
      font: inherit;
    }

    /* ============================ VIDEO STATE ============================ */
    .video-stage {
      position: relative;
      background: #000;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .video-stage::before {
      content: "";
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(120,90,140,0.5), transparent 55%),
        radial-gradient(ellipse at 70% 60%, rgba(60,80,120,0.5), transparent 60%),
        repeating-linear-gradient(135deg, #0e0e12 0 18px, #0a0a0e 18px 36px);
      opacity: 0.9;
    }
    .video-stage::after {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%);
    }
    .video-label {
      position: relative;
      z-index: 1;
      color: rgba(255,255,255,0.32);
      font: 11px var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle-overlay {
      position: absolute;
      left: 50%;
      bottom: 110px;
      transform: translateX(-50%);
      z-index: 2;
      max-width: 80%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 22px;
      border-radius: 14px;
      background: rgba(20,20,28,0.42);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.18),
        inset 0 -0.5px 0 rgba(255,255,255,0.06),
        0 0 0 0.5px rgba(255,255,255,0.10);
      pointer-events: none;
    }
    .subtitle-overlay .overlay-line {
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.005em;
      text-align: center;
    }
    .subtitle-overlay .overlay-line + .overlay-line {
      font-size: 17px;
      font-weight: 500;
      opacity: 0.86;
    }

    /* Sidebar — light glass, dark text, matches window chrome */
    .sidebar {
      position: relative;
      background: rgba(248, 248, 250, 0.55);
      backdrop-filter: blur(36px) saturate(180%);
      -webkit-backdrop-filter: blur(36px) saturate(180%);
      border-left: 0.5px solid rgba(0, 0, 0, 0.08);
      box-shadow: inset 0.5px 0 0 rgba(255,255,255,0.6);
      min-height: 0;
      display: flex;
      flex-direction: column;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .window.sidebar-hidden .video-state {
      grid-template-columns: 1fr 0;
    }
    .window.sidebar-hidden .sidebar {
      opacity: 0;
      pointer-events: none;
      transform: translateX(12px);
    }
    .window.video-expanded.sidebar-hidden .player-dock {
      right: 20px;
    }
    .sidebar-top {
      padding: 14px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 0.5px solid var(--hairline-soft);
    }
    .segmented {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px;
      padding: 2px;
      width: 100%;
      border-radius: 9px;
      background: rgba(0,0,0,0.06);
      box-shadow:
        inset 0 0.5px 0 rgba(0,0,0,0.05),
        0 0 0 0.5px rgba(0,0,0,0.04);
    }
    .segmented button {
      height: 24px;
      border: 0; border-radius: 7px;
      background: transparent;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 500;
    }
    .segmented button.active {
      background: rgba(255,255,255,0.85);
      color: var(--text);
      font-weight: 600;
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.95),
        0 0 0 0.5px rgba(0,0,0,0.06),
        0 1px 2px rgba(0,0,0,0.08);
    }
    .sidebar-summary {
      color: var(--text-3);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      padding: 0 2px;
    }
    .sidebar-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 6px 8px 14px;
    }
    .sidebar-row {
      appearance: none;
      width: 100%;
      margin: 2px 0;
      padding: 9px 11px;
      border-radius: 8px;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      display: flex; flex-direction: column; gap: 4px;
      transition: background 100ms ease, box-shadow 100ms ease;
      user-select: text;
    }
    .sidebar-row:hover {
      background: rgba(255,255,255,0.55);
    }
    .sidebar-row.selected {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,1),
        inset 0 -0.5px 0 rgba(255,255,255,0.5),
        0 0 0 0.5px rgba(10,132,255,0.55),
        0 0 0 3px rgba(10,132,255,0.10),
        0 6px 18px -4px rgba(15,18,30,0.18);
    }
    .sidebar-row .line {
      color: var(--text);
      font-size: 12.5px;
      opacity: 0.86;
    }
    .sidebar-row.selected .line {
      color: #0a1426;
      font-weight: 600;
      opacity: 1;
    }
    .sidebar-row .meta {
      color: var(--text-3);
    }
    .sidebar-row.selected .meta {
      color: var(--accent);
      font-weight: 600;
    }

    /* ============================ FLOATING PLAYER HUD ============================ */
    .player-dock {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      margin: 0 auto;
      max-width: 880px;
      border-radius: 22px;
      background: var(--glass-hud-bg);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      box-shadow: var(--glass-hud-shadow);
      display: flex;
      flex-direction: column;
      transition: right 240ms cubic-bezier(.22,.61,.36,1);
    }
    /* In video-expanded mode, sidebar (380px) takes the right column; keep HUD over the video only */
    .window.video-expanded .player-dock {
      right: 400px;
      background: rgba(28,28,34,0.48);
      box-shadow:
        0 0 0 0.5px rgba(255,255,255,0.12),
        inset 0 0.5px 0 rgba(255,255,255,0.22),
        inset 0 -0.5px 0 rgba(255,255,255,0.04),
        0 22px 50px -14px rgba(0,0,0,0.6),
        0 8px 18px -6px rgba(0,0,0,0.4);
    }
    @media (max-width: 980px) {
      .window.video-expanded .player-dock { right: 20px; }
    }

    /* Scrubber row inside the HUD */
    .scrubber {
      height: 30px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 0.5px solid rgba(0,0,0,0.07);
    }
    .window.video-expanded .scrubber {
      border-bottom-color: rgba(255,255,255,0.10);
    }

    .time {
      width: 38px;
      color: var(--text-2);
      font: 11px var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .time.end { color: var(--text-3); text-align: right; }
    .window.video-expanded .time { color: rgba(255,255,255,0.75); }
    .window.video-expanded .time.end { color: rgba(255,255,255,0.55); }

    .slider {
      --value: 0%;
      position: relative;
      height: 14px;
      display: flex;
      align-items: center;
      flex: 1;
    }
    .slider::before, .slider::after {
      content: "";
      position: absolute;
      left: 0;
      height: 4px;
      border-radius: 2px;
    }
    .slider::before { right: 0; background: rgba(0,0,0,0.12); }
    .slider::after { width: var(--value); background: var(--accent); }
    .window.video-expanded .slider::before { background: rgba(255,255,255,0.18); }

    .thumb {
      position: absolute;
      left: calc(var(--value) - 7px);
      z-index: 1;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow:
        0 0 0 0.5px rgba(0,0,0,0.18),
        inset 0 0.5px 0 rgba(255,255,255,0.9),
        0 1px 3px rgba(0,0,0,0.25),
        0 2px 8px rgba(0,0,0,0.15);
    }

    /* Main HUD row — left / center / right tri-column */
    .player-hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      min-width: 0;
    }
    .hud-left {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      justify-self: start;
    }
    .hud-center {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-self: center;
    }
    .hud-right {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-self: end;
    }

    .icon-button {
      appearance: none;
      border: 0;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      border-radius: 999px;
      background: transparent;
      color: rgba(0,0,0,0.78);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 100ms ease, box-shadow 100ms ease, transform 120ms ease;
    }
    .icon-button svg {
      flex: 0 0 auto;
    }
    .subtitle-button {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
    }
    .transport-button {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
    }
    .transport-button svg {
      width: 18px;
      height: 18px;
    }
    .transport-primary {
      width: 44px;
      height: 44px;
      flex-basis: 44px;
    }
    .transport-primary svg {
      width: 20px;
      height: 20px;
    }
    .icon-button:hover {
      background: rgba(255,255,255,0.55);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.9),
        0 0 0 0.5px rgba(0,0,0,0.05);
    }
    .icon-button:active { transform: scale(0.94); }
    .icon-button.selected {
      background: #fff;
      color: #1a1a1f;
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,1),
        0 0 0 0.5px rgba(0,0,0,0.07),
        0 1px 3px rgba(0,0,0,0.10);
    }
    .window.video-expanded .icon-button {
      color: rgba(255,255,255,0.96);
    }
    .window.video-expanded .icon-button svg {
      filter: drop-shadow(0 0.5px 1px rgba(0,0,0,0.4));
    }
    .window.video-expanded .icon-button:hover {
      background: rgba(255,255,255,0.18);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.25),
        0 0 0 0.5px rgba(255,255,255,0.10);
    }
    .window.video-expanded .icon-button.selected {
      background: #fff;
      color: #1a1a1f;
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,1),
        0 0 0 0.5px rgba(255,255,255,0.75),
        0 1px 4px rgba(0,0,0,0.22);
    }
    .window.video-expanded .icon-button.selected svg {
      filter: none;
    }
    /* Big play button */
    .play-button {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      border-radius: 999px;
      background: rgba(255,255,255,0.85);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,1),
        inset 0 -0.5px 0 rgba(0,0,0,0.04),
        0 0 0 0.5px rgba(0,0,0,0.07),
        0 2px 6px rgba(0,0,0,0.10);
      color: #1a1a1f;
    }
    .play-button:hover {
      background: rgba(255,255,255,0.95);
    }
    .window.video-expanded .play-button {
      background: rgba(255,255,255,0.92);
      color: #1a1a1f;
    }
    .transport-primary.play-button {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
    }

    /* Source/Now-playing toggle (left of transport) */
    .source-toggle {
      appearance: none;
      min-width: 38px;
      height: 32px;
      max-width: 220px;
      padding: 0 12px 0 10px;
      flex: 0 1 auto;
      border-radius: 999px;
      border: 0.5px solid var(--pill-border);
      background: var(--pill-bg);
      color: var(--pill-fg);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--pill-shadow);
      transition: background 180ms ease, transform 180ms cubic-bezier(.34,1.56,.64,1), color 180ms ease;
    }
    .source-toggle:hover { background: var(--pill-hover-bg); }
    .source-toggle .source-chevron {
      color: currentColor;
      display: inline-flex;
      transform: rotate(180deg);
      transition: transform 200ms ease;
    }
    .window.video-expanded .source-toggle { color: var(--pill-fg); }
    .window.video-expanded .source-toggle:hover { background: var(--pill-hover-bg); }
    .window.video-expanded .source-toggle .source-chevron {
      color: currentColor;
      transform: rotate(0deg);
    }

    .source-label {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.005em;
    }
    /* Volume control mirrors the App: hover expands the slider to the right; click toggles mute. */
    .volume-host {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      overflow: visible;
    }
    .volume-popover {
      position: absolute;
      left: 32px;
      top: 50%;
      transform: translateY(-50%) translateX(-4px);
      z-index: 50;
      height: 28px;
      width: 144px;
      padding: 0 8px;
      border-radius: 9px;
      background: rgba(255,255,255,0.86);
      backdrop-filter: blur(34px) saturate(180%);
      -webkit-backdrop-filter: blur(34px) saturate(180%);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.95),
        0 0 0 0.5px rgba(0,0,0,0.08),
        0 4px 14px -6px rgba(15,18,30,0.24);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease, transform 160ms cubic-bezier(.22,.61,.36,1);
    }
    .volume-host:hover .volume-popover {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-50%) translateX(0);
    }
    .volume-popover .slider {
      flex: 0 0 86px;
      height: 18px;
    }
    .volume-popover .slider::before,
    .volume-popover .slider::after {
      height: 5px;
      border-radius: 999px;
    }
    .volume-popover .slider::after { background: rgba(0,0,0,0.64); }
    .volume-popover .thumb { display: none; }
    .volume-percent {
      width: 34px;
      text-align: right;
      color: var(--text-3);
      font: 600 11px var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .window.video-expanded .volume-popover {
      background: rgba(255,255,255,0.86);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.95),
        0 0 0 0.5px rgba(0,0,0,0.08),
        0 4px 14px -6px rgba(0,0,0,0.36);
    }
    .window.video-expanded .volume-popover .slider::before { background: rgba(0,0,0,0.12); }
    .window.video-expanded .volume-popover .slider::after { background: rgba(0,0,0,0.64); }

    .speed-button {
      appearance: none;
      border: 0.5px solid var(--pill-border);
      width: 54px;
      height: 28px;
      padding: 0;
      border-radius: 999px;
      background: var(--pill-bg);
      color: var(--pill-fg);
      box-shadow: var(--pill-shadow);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      transition: background 180ms ease, transform 180ms cubic-bezier(.34,1.56,.64,1), color 180ms ease;
    }
    .speed-button:hover { background: var(--pill-hover-bg); }
    .speed-button[aria-expanded="true"] {
      background: var(--pill-hover-bg);
      box-shadow: var(--pill-shadow);
    }
    .window.video-expanded .speed-button { color: var(--pill-fg); }
    .window.video-expanded .speed-button:hover { background: var(--pill-hover-bg); }
    .window.video-expanded .speed-button[aria-expanded="true"] {
      background: var(--pill-hover-bg);
      box-shadow: var(--pill-shadow);
    }

    .speed-control { position: relative; display: inline-flex; flex: 0 0 auto; }

    .speed-menu {
      position: absolute;
      right: 0;
      bottom: calc(100% + 10px);
      z-index: 60;
      width: 124px;
      padding: 5px;
      border-radius: 11px;
      background: rgba(248,248,250,0.78);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      box-shadow:
        0 0 0 0.5px rgba(0,0,0,0.12),
        inset 0 0.5px 0 rgba(255,255,255,0.9),
        0 18px 36px -8px rgba(0,0,0,0.30),
        0 4px 12px rgba(0,0,0,0.10);
    }

    .speed-option {
      appearance: none;
      width: 100%;
      height: 26px;
      padding: 0 10px 0 8px;
      border: 0; border-radius: 7px;
      background: transparent;
      color: var(--text);
      display: grid;
      grid-template-columns: 16px 1fr;
      column-gap: 6px;
      align-items: center;
      font-size: 12.5px;
      font-variant-numeric: tabular-nums;
      text-align: left;
    }
    .speed-option:hover, .speed-option:focus-visible {
      outline: 0;
      background: var(--accent);
      color: #fff;
    }
    .speed-check {
      color: var(--accent);
      font-size: 11px;
      text-align: center;
      opacity: 0;
    }
    .speed-option.selected .speed-check { opacity: 1; }
    .speed-option:hover .speed-check,
    .speed-option:focus-visible .speed-check { color: currentColor; }

    .hidden { display: none; }

    /* Scrollbar styling — thin, glassy */
    .results-scroll::-webkit-scrollbar,
    .sidebar-list::-webkit-scrollbar { width: 10px; }
    .results-scroll::-webkit-scrollbar-thumb,
    .sidebar-list::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.18);
      border: 3px solid transparent;
      background-clip: padding-box;
      border-radius: 10px;
    }
    .sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.35); background-clip: padding-box; }
    .results-scroll::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.32); background-clip: padding-box; }

    @media (max-width: 980px) {
      body { padding: 54px 14px 14px; }
      .window { height: calc(100vh - 68px); }
      .test-controls { right: 14px; }
      .search-field { min-width: 240px; }
      .video-state { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .volume, .hud-meta { display: none; }
    }


    /* ============================ THEME + COMPONENT CLASS OVERRIDES ============================ */
    :root {

    body {
      background: var(--desktop-bg);
      transition: background 240ms ease, color 180ms ease;
    }
    body::before { background-image: var(--desktop-overlay); }
    body[data-search-bg="white"] { --search-page-bg: #ffffff; }
    body[data-search-bg="red"] { --search-page-bg: #fff1f2; }
    body[data-search-bg="yellow"] { --search-page-bg: #fff8df; }
    body[data-search-bg="blue"] { --search-page-bg: #edf5ff; }
    body[data-search-bg="purple"] { --search-page-bg: #f5efff; }
    body[data-search-bg="gray"] { --search-page-bg: #2f3035; }
    body[data-search-bg="black"] { --search-page-bg: #000000; }
    .window::before { box-shadow: var(--window-inner-ring); }
    .window::after { background: var(--window-sheen); }
    .toolbar {
      border-bottom-color: var(--hairline-soft);
      background: var(--toolbar-bg);
    }
    .toolbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .tool-button,
    .icon-button {
      border: 0.5px solid transparent;

  <script>
/*
  CueSeeker Liquid Glass v4 split-source prototype interactions.
  Legacy visual state classes are mirrored with ui-* state classes so future
  edits can target the component taxonomy while preserving v3 visual parity.
*/

const win = document.getElementById("window");
    const sourceToggle = document.getElementById("sourceToggle");
    const currentZh = document.querySelector("[data-current-zh]");
    const currentJa = document.querySelector("[data-current-ja]");
    const searchInput = document.getElementById("searchInput");
    const clearSearch = document.getElementById("clearSearch");
    const sidebarCount = document.getElementById("sidebarCount");
    const speedButton = document.getElementById("speedButton");
    const speedMenu = document.getElementById("speedMenu");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const shioriToggle = document.getElementById("shioriToggle");
    const subtitleToggle = document.getElementById("subtitleToggle");
    const sidePanelToggle = document.getElementById("sidePanelToggle");
    const subtitleOverlay = document.querySelector(".subtitle-overlay");
    const themeToggle = document.getElementById("themeToggle");
    const themeLabel = document.getElementById("themeLabel");
    const themeIcon = document.getElementById("themeIcon");
    const colorToggle = document.getElementById("colorToggle");
    const disableAllToggle = document.getElementById("disableAllToggle");
    const collapseAllButton = document.querySelector("[data-action='collapse-all']");

    let isPlaying = false;
    const searchBackgrounds = [
      { id: "white", label: "White" },
      { id: "red", label: "Pale red" },
      { id: "yellow", label: "Pale yellow" },
      { id: "blue", label: "Pale blue" },
      { id: "purple", label: "Pale purple" },
      { id: "gray", label: "Dark gray" },
      { id: "black", label: "Black" },
    ];
    let searchBackgroundIndex = 0;

    function setTheme(theme) {
      const dark = theme === "dark";
      document.body.dataset.theme = dark ? "dark" : "light";
      themeLabel.textContent = dark ? "Dark" : "Light";
      themeIcon.setAttribute("href", dark ? "#moon" : "#sun");
      themeToggle.setAttribute("aria-label", dark ? "Current theme: dark mode. Switch to light mode" : "Current theme: light mode. Switch to dark mode");
      themeToggle.setAttribute("aria-pressed", dark ? "true" : "false");
    }

    function setControlsDisabled(disabled) {
      win.classList.toggle("controls-disabled", disabled);
      disableAllToggle.classList.toggle("on", disabled);
      disableAllToggle.classList.toggle("ui-is-on", disabled);
      disableAllToggle.setAttribute("aria-pressed", disabled ? "true" : "false");
      win.querySelectorAll("button").forEach((button) => {
        button.disabled = disabled;
      });
      if (!disabled) {
        updateCollapseAllState();
      }
    }

    function setSearchBackground(index) {
      searchBackgroundIndex = index % searchBackgrounds.length;
      const background = searchBackgrounds[searchBackgroundIndex];
      document.body.dataset.searchBg = background.id;
      colorToggle.setAttribute("aria-label", `Search background color: ${background.label}`);
    }

    themeToggle.addEventListener("click", () => {
      setTheme(document.body.dataset.theme === "dark" ? "light" : "dark");
    });

    colorToggle.addEventListener("click", () => {
      setSearchBackground(searchBackgroundIndex + 1);
    });

    disableAllToggle.addEventListener("click", () => {
      setControlsDisabled(!win.classList.contains("controls-disabled"));
    });

    setTheme("light");
    setSearchBackground(0);
    setControlsDisabled(false);

    function setToggleIconButton(button, selected) {
      button.classList.toggle("selected", selected);
      button.classList.toggle("ui-is-selected", selected);
      button.setAttribute("aria-pressed", selected ? "true" : "false");
      const icon = button.querySelector("use");
      if (icon && button.dataset.iconOff && button.dataset.iconOn) {
        icon.setAttribute("href", "#" + (selected ? button.dataset.iconOn : button.dataset.iconOff));
      }
    }

    function toggleIconButton(button) {
      const selected = !button.classList.contains("selected");
      setToggleIconButton(button, selected);
      return selected;
    }

    document.querySelectorAll(".toggle-icon-button").forEach((button) => {
      setToggleIconButton(button, button.classList.contains("selected") || button.getAttribute("aria-pressed") === "true");
    });

    document.querySelectorAll(".toolbar .toggle-icon-button").forEach((button) => {
      button.addEventListener("click", () => toggleIconButton(button));
    });

    function escapeHTML(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function highlight(value, query) {
      if (!query) return escapeHTML(value);
      const index = value.indexOf(query);
      if (index === -1) return escapeHTML(value);
      return [
        escapeHTML(value.slice(0, index)),
        "<mark>",
        escapeHTML(value.slice(index, index + query.length)),
        "</mark>",
        highlight(value.slice(index + query.length), query)
      ].join("");
    }

    function updateSearch(query) {
      document.querySelectorAll(".result-card, .sidebar-row").forEach((el) => {
        const matches = !query || el.dataset.zh.includes(query) || el.dataset.ja.includes(query);
        el.hidden = !matches;
        const lines = el.querySelectorAll(".line");
        lines[0].innerHTML = highlight(el.dataset.zh, query);
        lines[1].innerHTML = highlight(el.dataset.ja, query);
      });

      let total = 0;
      document.querySelectorAll(".group").forEach((group) => {
        const visible = Array.from(group.querySelectorAll(".result-card")).filter((c) => !c.hidden);
        group.hidden = visible.length === 0;
        const count = group.querySelector(".group-count");
        count.textContent = `${visible.length} ${visible.length === 1 ? "result" : "results"}`;
        total += visible.length;
      });

      const summary = document.querySelector(".summary span");
      if (summary) {
        summary.innerHTML = query
          ? `Found <strong>${total}</strong> result${total === 1 ? "" : "s"} for &ldquo;${escapeHTML(query)}&rdquo;`
          : `Found <strong>185</strong> results in <strong>74</strong> files`;
      }
      updateSidebarSummary();
      updateCollapseAllState();
    }

    function updateClearSearchVisibility() {
      const hidden = searchInput.value.trim().length === 0;
      clearSearch.hidden = hidden;
      clearSearch.style.display = hidden ? "none" : "";
      clearSearch.setAttribute("aria-hidden", hidden ? "true" : "false");
      clearSearch.tabIndex = hidden ? -1 : 0;
    }

    function syncSearchFromInput() {
      updateClearSearchVisibility();
      updateSearch(searchInput.value.trim());
    }

    function scheduleSearchSync() {
      requestAnimationFrame(syncSearchFromInput);
      setTimeout(syncSearchFromInput, 0);
    }

    function updateCollapseAllState() {
      if (!collapseAllButton || win.classList.contains("controls-disabled")) return;
      const visibleGroups = Array.from(document.querySelectorAll(".group")).filter((group) => !group.hidden);
      const hasExpandedGroup = visibleGroups.some((group) => !group.classList.contains("collapsed"));
      collapseAllButton.disabled = !hasExpandedGroup;
      collapseAllButton.setAttribute("aria-disabled", hasExpandedGroup ? "false" : "true");
    }

    function updateSidebarSummary() {
      const activeTab = document.querySelector(".segmented button.active")?.dataset.tab;
      if (activeTab === "subs") {
        sidebarCount.textContent = "317 cues";
      } else {
        const visible = document.querySelectorAll(".sidebar-row:not([hidden])").length;
        sidebarCount.textContent = `${visible} result${visible === 1 ? "" : "s"} matching`;
      }
    }

    function selectRank(rank, time, zh, ja) {
      document.querySelectorAll(".result-card, .sidebar-row").forEach((el) => {
        el.classList.toggle("selected", el.dataset.rank === rank);
        el.classList.toggle("ui-is-selected", el.dataset.rank === rank);
      });
      currentZh.textContent = zh;
      currentJa.textContent = ja;
      sourceToggle.querySelector(".source-label").textContent = "Ave Mujica · 01";
    }

    document.querySelectorAll(".result-card, .sidebar-row").forEach((el) => {
      el.addEventListener("click", () => {
        selectRank(el.dataset.rank, el.dataset.time, el.dataset.zh, el.dataset.ja);
      });
      el.addEventListener("dblclick", () => {
        win.classList.add("video-expanded");
        sourceToggle.setAttribute("aria-pressed", "true");
      });
    });

    sourceToggle.addEventListener("click", () => {
      const expanded = win.classList.toggle("video-expanded");
      sourceToggle.setAttribute("aria-pressed", expanded ? "true" : "false");
    });

    document.querySelectorAll(".segmented button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".segmented button").forEach((b) => {
          const active = b === btn;
          b.classList.toggle("active", active);
          b.classList.toggle("ui-is-active", active);
        });
        updateSidebarSummary();
      });
    });

    shioriToggle.addEventListener("click", () => {
      toggleIconButton(shioriToggle);
    });

    subtitleToggle.addEventListener("click", () => {
      const selected = toggleIconButton(subtitleToggle);
      subtitleOverlay.hidden = !selected;
    });

    sidePanelToggle.addEventListener("click", () => {
      const selected = toggleIconButton(sidePanelToggle);
      win.classList.toggle("sidebar-hidden", !selected);
    });

    document.querySelectorAll(".group-header").forEach((header) => {
      header.addEventListener("click", () => {
        header.parentElement.classList.toggle("collapsed");
        updateCollapseAllState();
      });
    });

    collapseAllButton.addEventListener("click", (e) => {
      document.querySelectorAll(".group").forEach((group) => {
        group.classList.add("collapsed");
      });
      e.currentTarget.textContent = "Collapse All";
      updateCollapseAllState();
    });

    updateClearSearchVisibility();
    updateCollapseAllState();

    ["input", "change", "keyup", "search", "cut", "paste", "compositionend", "focus", "blur"].forEach((eventName) => {
      searchInput.addEventListener(eventName, scheduleSearchSync);
    });
    clearSearch.addEventListener("click", () => {
      searchInput.value = "";
      syncSearchFromInput();
      searchInput.focus();
    });

    // Speed menu
    speedButton.addEventListener("click", (e) => {
      e.stopPropagation();
      closeVolume();
      const open = speedMenu.hasAttribute("hidden") ? false : true;
      if (open) {
        speedMenu.setAttribute("hidden", "");
        speedButton.setAttribute("aria-expanded", "false");
      } else {
        speedMenu.removeAttribute("hidden");
        speedButton.setAttribute("aria-expanded", "true");
      }
    });
    speedMenu.addEventListener("click", (e) => {
      const opt = e.target.closest(".speed-option");
      if (!opt) return;
      document.querySelectorAll(".speed-option").forEach((o) => {
        const selected = o === opt;
        o.classList.toggle("selected", selected);
        o.classList.toggle("ui-is-selected", selected);
        o.setAttribute("aria-checked", selected ? "true" : "false");
      });
      speedButton.textContent = opt.dataset.speed;
      speedMenu.setAttribute("hidden", "");
      speedButton.setAttribute("aria-expanded", "false");
    });

    // Volume control
    const volumeBtn = document.getElementById("volumeBtn");
    const volumeIcon = document.getElementById("volumeIcon");
    const volumeSlider = document.getElementById("volumeSlider");
    const volumePercent = document.getElementById("volumePercent");
    let volume = 36;
    let lastNonzeroVolume = 36;

    function closeVolume() {
      // Hover owns visibility, matching the App. This hook only keeps other menu code simple.
    }

    function setVolume(nextVolume, remember = true) {
      volume = Math.max(0, Math.min(100, nextVolume));
      const rounded = Math.round(volume);
      volumeSlider.style.setProperty("--value", volume + "%");
      volumeSlider.setAttribute("aria-valuenow", String(rounded));
      volumePercent.textContent = rounded + "%";
      volumeIcon.setAttribute("href", volume === 0 ? "#speaker-muted" : "#speaker");
      volumeBtn.setAttribute("aria-pressed", volume === 0 ? "true" : "false");
      volumeBtn.setAttribute("aria-label", volume === 0 ? "Unmute" : "Mute");
      if (remember && volume > 0) {
        lastNonzeroVolume = volume;
      }
    }

    volumeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      speedMenu.setAttribute("hidden", "");
      speedButton.setAttribute("aria-expanded", "false");
      setVolume(volume > 0 ? 0 : lastNonzeroVolume, volume === 0);
    });

    document.addEventListener("click", (e) => {
      if (!speedMenu.contains(e.target) && e.target !== speedButton) {
        speedMenu.setAttribute("hidden", "");
        speedButton.setAttribute("aria-expanded", "false");
      }
    });

    // Play/pause toggle
    playBtn.addEventListener("click", () => {
      isPlaying = !isPlaying;
      playIcon.innerHTML = `<use href="#${isPlaying ? "pause" : "play"}"></use>`;
    });

    // Sliders draggable for tactile feel
    document.querySelectorAll(".slider").forEach((slider) => {
      let dragging = false;
      const update = (clientX) => {
        const rect = slider.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        if (slider === volumeSlider) {
          setVolume(pct * 100, pct > 0);
        } else {
          slider.style.setProperty("--value", (pct * 100) + "%");
        }
      };
      slider.addEventListener("pointerdown", (e) => {
        dragging = true;
        slider.setPointerCapture(e.pointerId);
        update(e.clientX);
      });
      slider.addEventListener("pointermove", (e) => { if (dragging) update(e.clientX); });
      slider.addEventListener("pointerup", () => { dragging = false; });
      slider.addEventListener("pointercancel", () => { dragging = false; });
    });
  

</script>

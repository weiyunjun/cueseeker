<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CueSeeker — Info-page Card State Demo (P5.0 C2)</title>
  <style>
/*
  CueSeeker — Info-page card STATE demo (P5.0 C2). Self-contained share file.
  Inlined copy of styles.css — keep in sync with the split source.
*/
:root {
  color-scheme: light;
  --hairline: rgba(0, 0, 0, 0.08);
  --hairline-soft: rgba(0, 0, 0, 0.05);
  --text: #1a1a1f;
  --text-2: #4d4e55;
  --text-3: #7a7c84;
  --text-4: #adafb6;
  --accent: #0a84ff;
  --accent-soft: rgba(10, 132, 255, 0.16);
  --highlight: rgba(255, 204, 0, 0.42);
  --highlight-text: #4a3300;
  --page-bg: #f4f4f6;
  --pill-bg: rgba(255, 255, 255, 0.62);
  --pill-border: rgba(0, 0, 0, 0.08);
  --pill-hover-bg: rgba(255, 255, 255, 0.86);
  --pill-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 1), 0 0 0 0.5px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.10);
  --card-bg: rgba(255, 255, 255, 0.62);
  --card-hover-bg: rgba(255, 255, 255, 0.82);
  --card-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.92), inset 0 -0.5px 0 rgba(255, 255, 255, 0.22), 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(15, 18, 30, 0.06);
  --card-hover-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 1), 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 4px 12px -4px rgba(15, 18, 30, 0.14);
  --row-hover-bg: rgba(255, 255, 255, 0.62);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
}
body[data-theme="dark"] {
  color-scheme: dark;
  --hairline: rgba(255, 255, 255, 0.10);
  --hairline-soft: rgba(255, 255, 255, 0.07);
  --text: #f3f1f6;
  --text-2: #c9c6d2;
  --text-3: #aaa6b6;
  --text-4: #817d8d;
  --accent: #6ea6ff;
  --accent-soft: rgba(110, 166, 255, 0.18);
  --highlight: rgba(255, 214, 92, 0.32);
  --highlight-text: #fff0b5;
  --page-bg: #1f2027;
  --pill-bg: rgba(255, 255, 255, 0.10);
  --pill-border: rgba(255, 255, 255, 0.20);
  --pill-hover-bg: rgba(255, 255, 255, 0.18);
  --pill-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.24), 0 0 0 0.5px rgba(255, 255, 255, 0.06), 0 1px 3px rgba(0, 0, 0, 0.30);
  --card-bg: rgba(255, 255, 255, 0.10);
  --card-hover-bg: rgba(255, 255, 255, 0.15);
  --card-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.18), inset 0 -0.5px 0 rgba(255, 255, 255, 0.05), 0 0 0 0.5px rgba(255, 255, 255, 0.10), 0 1px 2px rgba(0, 0, 0, 0.22);
  --card-hover-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.24), 0 0 0 0.5px rgba(255, 255, 255, 0.14), 0 5px 14px -5px rgba(0, 0, 0, 0.44);
  --row-hover-bg: rgba(255, 255, 255, 0.12);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: var(--sf);
  background: var(--page-bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.demo-controls {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  padding: 12px 20px;
  background: var(--page-bg);
  border-bottom: 0.5px solid var(--hairline);
}
.demo-group { display: flex; align-items: center; gap: 6px; }
.demo-group > .demo-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-3);
  margin-right: 2px;
}
.demo-btn {
  appearance: none;
  height: 26px;
  padding: 0 12px;
  border-radius: 999px;
  border: 0.5px solid var(--pill-border);
  background: var(--pill-bg);
  box-shadow: var(--pill-shadow);
  color: var(--text);
  font: 600 11.5px var(--sf);
  cursor: pointer;
  transition: background 120ms ease, transform 140ms ease;
}
.demo-btn:hover { background: var(--pill-hover-bg); }
.demo-btn:active { transform: scale(0.95); }
.demo-btn.is-active {
  background: var(--accent);
  border-color: transparent;
  color: #fff;
}
.demo-note {
  width: 100%;
  font-size: 11.5px;
  color: var(--text-3);
  line-height: 1.45;
}
.demo-note code { font: 11px var(--mono); color: var(--text-2); }
.panel {
  position: relative;
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 0 60px;
  min-height: 70vh;
}
.results-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px 6px;
}
.results-header .summary {
  display: flex;
  align-items: baseline;
  gap: 8px;
  color: var(--text-2);
  font-size: 12.5px;
}
.results-header strong {
  color: var(--text);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.small-button {
  appearance: none;
  min-width: 92px;
  height: 26px;
  padding: 0 13px;
  border-radius: 999px;
  border: 0.5px solid var(--pill-border);
  background: var(--pill-bg);
  box-shadow: var(--pill-shadow);
  color: var(--text);
  font-size: 11.5px;
}
.scroll { padding: 4px 24px 0; }
.group {
  padding: 14px 0 6px;
  border-bottom: 0.5px solid var(--hairline-soft);
  margin-bottom: 6px;
}
.group:last-child { border-bottom: 0; }
.group-header {
  appearance: none;
  border: 0;
  width: 100%;
  padding: 5px 4px;
  border-radius: 7px;
  background: transparent;
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
  color: var(--text);
}
.group-header .chevron {
  width: 16px; height: 16px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-3);
  transform: rotate(90deg);
}
.group-title { font-size: 13px; font-weight: 600; color: var(--text); }
.group-count {
  color: var(--text-3);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 10px;
  margin: 10px 0 14px;
}
.result-card {
  appearance: none;
  text-align: left;
  border: 0;
  border-radius: 10px;
  background: var(--card-bg);
  box-shadow: var(--card-shadow);
  color: var(--text);
  padding: 11px 13px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: pointer;
  transition: background 140ms ease, box-shadow 140ms ease, transform 140ms ease;
}
.result-card:hover { background: var(--card-hover-bg); box-shadow: var(--card-hover-shadow); }
.result-card:active { transform: scale(0.995); }
.meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--text-3);
  font: 11px var(--mono);
  font-variant-numeric: tabular-nums;
}
.rank { display: inline-flex; align-items: center; gap: 5px; }
.line { color: var(--text); font-size: 13.5px; font-weight: 450; line-height: 1.4; opacity: 0.86; }
mark {
  background: var(--highlight);
  color: var(--highlight-text);
  padding: 1px 3px;
  border-radius: 3px;
  font: inherit;
}
.library-group { padding: 12px 0 10px; margin-bottom: 6px; }
.library-group-header {
  align-items: flex-start;
  gap: 10px;
  padding: 8px 4px;
  width: min(100%, 720px);
}
.library-group-header .chevron { margin-top: 2px; transform: rotate(90deg); }
.library-heading { display: flex; flex-direction: column; gap: 2px; }
.library-title { color: var(--text); font-size: 13.5px; font-weight: 700; line-height: 1.2; }
.library-count { color: var(--text-3); font-size: 12px; line-height: 1.2; }
.library-episode-grid { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 12px 30px; }
.library-episode-card {
  appearance: none;
  width: 66px;
  height: 42px;
  border: 0;
  border-radius: 8px;
  background: var(--card-bg);
  box-shadow: var(--card-shadow);
  color: var(--text);
  font: 700 12.5px var(--sf);
  font-variant-numeric: tabular-nums;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 140ms ease, box-shadow 140ms ease, transform 140ms ease;
}
.library-episode-card:hover { background: var(--card-hover-bg); box-shadow: var(--card-hover-shadow); }
.library-episode-card:active { transform: scale(0.96); }
.state-view {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 10px;
  padding: 80px 24px;
  min-height: 52vh;
  color: var(--text-2);
}
.state-icon {
  width: 46px;
  height: 46px;
  color: var(--text-4);
}
.state-icon.is-warning { color: #e0a13c; }
.state-title { font-size: 17px; font-weight: 700; color: var(--text); }
.state-message { font-size: 13px; color: var(--text-3); max-width: 360px; line-height: 1.5; }
.state-spinner {
  width: 22px;
  height: 22px;
  margin-top: 8px;
  border-radius: 50%;
  border: 2.5px solid var(--accent-soft);
  border-top-color: var(--accent);
  animation: state-spin 0.8s linear infinite;
}
@keyframes state-spin { to { transform: rotate(360deg); } }
.load-more {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px 0 8px;
  color: var(--text-3);
  font-size: 12px;
}
.load-more .state-spinner {
  width: 15px;
  height: 15px;
  margin: 0;
  border-width: 2px;
}
@media (prefers-reduced-motion: reduce) {
  .state-spinner { animation-duration: 1.6s; }
}
[hidden] { display: none !important; }
  </style>
</head>
<body data-theme="light">
  <div class="demo-controls">
    <div class="demo-group">
      <span class="demo-label">Search</span>
      <button class="demo-btn" type="button" data-surface="search" data-state="query-empty">No Query</button>
      <button class="demo-btn" type="button" data-surface="search" data-state="searching">Searching</button>
      <button class="demo-btn" type="button" data-surface="search" data-state="failed">Failed</button>
      <button class="demo-btn" type="button" data-surface="search" data-state="no-results">No Results</button>
      <button class="demo-btn" type="button" data-surface="search" data-state="results">Results</button>
      <button class="demo-btn" type="button" data-surface="search" data-state="results-loading-more">Results + Load More</button>
    </div>
    <div class="demo-group">
      <span class="demo-label">Library</span>
      <button class="demo-btn" type="button" data-surface="library" data-state="no-library">No Library</button>
      <button class="demo-btn" type="button" data-surface="library" data-state="loading">Loading</button>
      <button class="demo-btn" type="button" data-surface="library" data-state="failed">Failed</button>
      <button class="demo-btn" type="button" data-surface="library" data-state="no-videos">No Videos</button>
      <button class="demo-btn" type="button" data-surface="library" data-state="videos">Videos</button>
    </div>
    <div class="demo-group">
      <span class="demo-label">Shiori</span>
      <button class="demo-btn" type="button" data-surface="shiori" data-state="empty">No Shiori</button>
      <button class="demo-btn" type="button" data-surface="shiori" data-state="list">List</button>
    </div>
    <div class="demo-group">
      <span class="demo-label">Theme</span>
      <button class="demo-btn" type="button" id="themeToggle">Toggle Dark</button>
    </div>
    <p class="demo-note">
      Demo-only control bar — not part of the App component taxonomy. Each
      button reproduces a real App condition. Titles and messages are verbatim
      from <code>SearchView.swift</code>. State icons are indicative; the App
      uses SF Symbols. Mock card data is prototype-only.
    </p>
  </div>

  <main class="panel" id="panel" aria-live="polite"></main>

  <script>
/*
  Inlined copy of script.js — keep in sync with the split source.
*/
(function () {
  "use strict";
  var ICON = {
    search: '<svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>',
    tray: '<svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 14l3-9h12l3 9v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 14h5l1.5 2.5h5L16 14h5"/></svg>',
    warn: '<svg class="state-icon is-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l9.5 17H2.5z"/><line x1="12" y1="9.5" x2="12" y2="14"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>',
    folder: '<svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    video: '<svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg>',
    bookmark: '<svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 4h12v17l-6-4-6 4z"/></svg>'
  };
  function stateView(icon, title, message, spinner) {
    return (
      '<div class="state-view">' +
      icon +
      '<div class="state-title">' + title + '</div>' +
      '<div class="state-message">' + message + '</div>' +
      (spinner ? '<div class="state-spinner" role="status" aria-label="Loading"></div>' : '') +
      '</div>'
    );
  }
  function chevron() {
    return '<span class="chevron"><svg width="9" height="9" viewBox="0 0 9 9" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 1.5L6.5 5 2 8.5"/></svg></span>';
  }
  function card(rank, time, zh, ja) {
    return (
      '<button class="result-card" type="button">' +
      '<span class="meta"><span class="rank">#' + rank + '</span><span>' + time + '</span></span>' +
      '<span class="line">' + zh + '</span>' +
      '<span class="line">' + ja + '</span>' +
      '</button>'
    );
  }
  function searchResultsBody(withLoadMore) {
    var html =
      '<div class="results-header">' +
      '<div class="summary"><span>Found <strong>185</strong> results in <strong>74</strong> files</span></div>' +
      '<button class="small-button" type="button">Collapse All</button>' +
      '</div>' +
      '<div class="scroll">' +
      '<section class="group">' +
      '<button class="group-header" type="button">' + chevron() +
      '<span class="group-title">AVE MUJICA — 01</span><span class="group-count">4 results</span></button>' +
      '<div class="cards">' +
      card(1, "00:30", "毋庸担心 月霞自会为我们将她唤醒", "<mark>大丈夫</mark> 月の光が起こしてくれますわ") +
      card(2, "09:41", "没问题的 诚实就是你的美德哦", "<mark>大丈夫</mark> あなたの誠実さは美徳よ") +
      card(3, "18:37", "祥 武道馆 没问题吧", "祥　武道館　<mark>大丈夫</mark>") +
      card(4, "18:43", "当然没问题", "<mark>大丈夫</mark>に決まっているでしょう") +
      '</div></section>' +
      '<section class="group">' +
      '<button class="group-header" type="button">' + chevron() +
      '<span class="group-title">AVE MUJICA — 02</span><span class="group-count">2 results</span></button>' +
      '<div class="cards">' +
      card(5, "14:26", "小初 你没事吧", "ういちゃん <mark>大丈夫</mark>") +
      card(6, "14:29", "我没事", "私は<mark>大丈夫</mark>だよ") +
      '</div></section>';
    if (withLoadMore) {
      html +=
        '<div class="load-more"><div class="state-spinner" role="status" aria-label="Loading more"></div>' +
        '<span>Loading more results…</span></div>';
    }
    html += '</div>';
    return html;
  }
  function libraryFolder(title, count, eps) {
    var grid = "";
    for (var i = 1; i <= eps; i++) {
      var n = i < 10 ? "0" + i : "" + i;
      grid += '<button class="library-episode-card" type="button">EP' + n + "</button>";
    }
    return (
      '<section class="library-group">' +
      '<button class="group-header library-group-header" type="button">' + chevron() +
      '<span class="library-heading"><span class="library-title">' + title + '</span>' +
      '<span class="library-count">' + count + '</span></span></button>' +
      '<div class="library-episode-grid">' + grid + '</div>' +
      '</section>'
    );
  }
  function libraryBody() {
    return (
      '<div class="scroll" style="padding-top:18px">' +
      libraryFolder("Ave Mujica", "13 episodes", 13) +
      libraryFolder("It's MyGO!!!!!", "13 episodes", 13) +
      '</div>'
    );
  }
  function shioriBody() {
    return (
      '<div class="results-header">' +
      '<div class="summary"><span><strong>3</strong> shioris in <strong>2</strong> files</span></div>' +
      '<button class="small-button" type="button">Collapse All</button>' +
      '</div>' +
      '<div class="scroll">' +
      '<section class="group">' +
      '<button class="group-header" type="button">' + chevron() +
      '<span class="group-title">IT\'S MYGO!!!!! - 02</span><span class="group-count">1 shiori</span></button>' +
      '<div class="cards">' +
      card(1, "00:26", "没事吧?", "大丈夫?") +
      '</div></section>' +
      '<section class="group">' +
      '<button class="group-header" type="button">' + chevron() +
      '<span class="group-title">葬送的芙莉莲 - 09</span><span class="group-count">2 shioris</span></button>' +
      '<div class="cards">' +
      card(1, "17:24", "她到底给这小姑娘做了什么修行", "この小娘に　どんな修行を叩き込んだ") +
      card(2, "22:53", "你听得见我吗", "Can you hear me") +
      '</div></section>' +
      '</div>'
    );
  }
  var STATES = {
    "search/query-empty": function () {
      return stateView(ICON.search, "No Search Query",
        "Type a query in the topbar Search field and press Return.");
    },
    "search/searching": function () {
      return stateView(ICON.search, "Searching",
        "Looking through indexed subtitle text.", true);
    },
    "search/failed": function () {
      return stateView(ICON.warn, "Search Failed", "Database is not initialized");
    },
    "search/no-results": function () {
      return stateView(ICON.tray, "No Results",
        "No indexed subtitle entries matched this query.");
    },
    "search/results": function () { return searchResultsBody(false); },
    "search/results-loading-more": function () { return searchResultsBody(true); },
    "library/no-library": function () {
      return stateView(ICON.folder, "No Library",
        "Add subtitle folders in CueSeeker &gt; Settings..., then reindex.");
    },
    "library/loading": function () {
      return stateView(ICON.folder, "Loading Library",
        "Reading indexed videos.", true);
    },
    "library/failed": function () {
      return stateView(ICON.warn, "Library Failed", "Indexed database unavailable");
    },
    "library/no-videos": function () {
      return stateView(ICON.video, "No Videos",
        "Reindex subtitle folders to populate Library videos.");
    },
    "library/videos": function () { return libraryBody(); },
    "shiori/empty": function () {
      return stateView(ICON.bookmark, "No Shiori",
        "Save subtitles from playback to collect Shiori.");
    },
    "shiori/list": function () { return shioriBody(); }
  };
  var panel = document.getElementById("panel");
  var buttons = Array.prototype.slice.call(
    document.querySelectorAll(".demo-btn[data-surface]")
  );
  function render(key) {
    var fn = STATES[key];
    if (!fn) return;
    panel.innerHTML = fn();
    buttons.forEach(function (b) {
      var k = b.getAttribute("data-surface") + "/" + b.getAttribute("data-state");
      b.classList.toggle("is-active", k === key);
    });
  }
  buttons.forEach(function (b) {
    b.addEventListener("click", function () {
      render(b.getAttribute("data-surface") + "/" + b.getAttribute("data-state"));
    });
  });
  var themeToggle = document.getElementById("themeToggle");
  themeToggle.addEventListener("click", function () {
    var dark = document.body.getAttribute("data-theme") === "dark";
    document.body.setAttribute("data-theme", dark ? "light" : "dark");
    themeToggle.textContent = dark ? "Toggle Dark" : "Toggle Light";
  });
  render("search/query-empty");
})();
  </script>
</body>
</html>

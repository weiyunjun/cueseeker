<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CueSeeker macOS Native Search Results Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --window: #fbfbfc;
      --surface: #ffffff;
      --chrome: rgba(246, 246, 248, 0.92);
      --content: #f7f7f8;
      --card: #ffffff;
      --card-hover: #f4f4f6;
      --card-selected: #e9f2ff;
      --hairline: rgba(0, 0, 0, 0.14);
      --hairline-soft: rgba(0, 0, 0, 0.08);
      --text: #1f2024;
      --secondary: #6f7076;
      --tertiary: #9b9ca2;
      --control-hover: rgba(0, 0, 0, 0.055);
      --control-selected: rgba(0, 0, 0, 0.12);
      --accent: #0a84ff;
      --accent-soft: #eaf4ff;
      --highlight: #fff1a8;
      --track: rgba(0, 0, 0, 0.13);
      --track-buffered: rgba(0, 0, 0, 0.08);
      --shadow: rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #f8f8f9 0%, #eeeeef 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: default;
    }

    .window {
      width: min(1520px, calc(100vw - 64px));
      height: min(940px, calc(100vh - 64px));
      min-height: 720px;
      border: 1px solid var(--hairline);
      border-radius: 18px;
      background: var(--window);
      box-shadow: 0 22px 68px var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: 72px minmax(0, 1fr) auto;
    }

    .topbar {
      background: var(--surface);
      display: grid;
      grid-template-columns: 160px minmax(520px, 760px) 160px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 26px;
    }

    .traffic {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .traffic-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }

    .traffic-dot.close { background: #ff5f57; }
    .traffic-dot.minimize { background: #ffbd2e; }
    .traffic-dot.zoom { background: #28c840; }

    .search-cluster {
      min-width: 0;
      justify-self: center;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .nav-button,
    .icon-button,
    .speed-button {
      appearance: none;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #303137;
      height: 30px;
      min-width: 30px;
      padding: 0;
      display: grid;
      place-items: center;
      transition: background 110ms ease, color 110ms ease;
    }

    .nav-button:hover,
    .icon-button:hover,
    .speed-button:hover {
      background: var(--control-hover);
    }

    .nav-button.selected,
    .icon-button.selected {
      background: var(--control-selected);
    }

    .nav-button svg,
    .icon-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .search-field {
      flex: 0 1 520px;
      height: 40px;
      min-width: 280px;
      border: 1px solid rgba(0, 0, 0, 0.16);
      border-radius: 11px;
      background: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .search-field svg {
      width: 16px;
      height: 16px;
      stroke: #8a8b91;
      flex: 0 0 auto;
    }

    .query {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 15px;
      font-weight: 600;
    }

    .toolbar-status {
      justify-self: end;
      color: var(--tertiary);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .content {
      min-height: 0;
      overflow: auto;
      background: var(--content);
      border-top: 1px solid var(--hairline-soft);
      padding: 22px 28px 28px;
    }

    .content-inner {
      max-width: 1280px;
      margin: 0 auto;
    }

    .result-summary {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      margin: 0 0 16px;
      color: var(--secondary);
      font-size: 13px;
      font-weight: 600;
    }

    .result-summary strong {
      color: var(--text);
      font-size: 18px;
      font-weight: 680;
    }

    .summary-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--tertiary);
      font-size: 12px;
    }

    .group {
      margin: 0 0 18px;
    }

    .group-header {
      min-height: 34px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      color: var(--secondary);
      font-size: 12px;
      font-weight: 650;
      padding: 0 8px;
    }

    .disclosure {
      appearance: none;
      border: 0;
      border-radius: 6px;
      background: transparent;
      width: 24px;
      height: 24px;
      color: var(--secondary);
      display: grid;
      place-items: center;
    }

    .disclosure:hover {
      background: var(--control-hover);
    }

    .disclosure svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .group-title {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .group-count {
      color: var(--tertiary);
      font-variant-numeric: tabular-nums;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .cue-card {
      appearance: none;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      min-height: 126px;
      padding: 13px 15px 14px;
      text-align: left;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 13px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.025);
    }

    .cue-card:hover {
      background: var(--card-hover);
    }

    .cue-card.selected {
      border-color: color-mix(in srgb, var(--accent) 28%, transparent);
      background: var(--card-selected);
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--tertiary);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .rank {
      color: var(--secondary);
    }

    .timestamp {
      color: var(--tertiary);
    }

    .cue-lines {
      align-self: center;
      display: grid;
      gap: 7px;
    }

    .cue-line {
      color: #202126;
      font-size: 15px;
      font-weight: 640;
      line-height: 1.35;
    }

    .cue-line.secondary {
      font-weight: 590;
    }

    mark {
      background: var(--highlight);
      color: inherit;
      border-radius: 3px;
      padding: 0 2px;
    }

    .bottom-player {
      min-width: 0;
      background: var(--chrome);
      border-top: 1px solid var(--hairline);
      backdrop-filter: saturate(1.8) blur(18px);
      -webkit-backdrop-filter: saturate(1.8) blur(18px);
      display: grid;
      grid-template-rows: 24px 54px;
      color: var(--text);
    }

    .scrubber-row {
      min-width: 0;
      display: grid;
      grid-template-columns: 54px minmax(120px, 1fr) 54px;
      align-items: center;
      gap: 12px;
      padding: 8px 24px 0;
      color: var(--secondary);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .time {
      white-space: nowrap;
    }

    .time.end {
      text-align: right;
    }

    .timeline {
      height: 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      padding: 0;
      position: relative;
    }

    .timeline::before,
    .timeline::after,
    .timeline .played {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      height: 3px;
      border-radius: 999px;
      transform: translateY(-50%);
    }

    .timeline::before {
      right: 0;
      background: var(--track);
    }

    .timeline::after {
      width: 78%;
      background: var(--track-buffered);
    }

    .timeline .played {
      width: 62%;
      background: var(--accent);
      z-index: 1;
    }

    .timeline .thumb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.18);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
      position: absolute;
      left: 62%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      opacity: 0.72;
    }

    .control-row {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(300px, 1fr) auto minmax(300px, 1fr);
      align-items: center;
      gap: 20px;
      padding: 0 22px 8px;
    }

    .now-playing,
    .transport,
    .utility {
      min-width: 0;
      display: flex;
      align-items: center;
    }

    .now-playing {
      gap: 10px;
    }

    .transport {
      justify-content: center;
      gap: 7px;
      color: #28292e;
    }

    .utility {
      justify-content: flex-end;
      gap: 6px;
      color: #303137;
    }

    .source-title {
      min-width: 0;
      max-width: 330px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
      font-weight: 650;
    }

    .volume {
      margin-left: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--secondary);
    }

    .volume-meter {
      width: 76px;
      height: 3px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.13);
      position: relative;
    }

    .volume-meter::before {
      content: "";
      position: absolute;
      inset: 0 34% 0 0;
      border-radius: inherit;
      background: rgba(0, 0, 0, 0.42);
    }

    .divider {
      width: 1px;
      height: 22px;
      background: var(--hairline-soft);
      margin: 0 5px;
      flex: 0 0 auto;
    }

    .icon-button.compact svg {
      width: 17px;
      height: 17px;
    }

    .transport .icon-button {
      width: 32px;
      height: 32px;
    }

    .transport .icon-button svg {
      width: 20px;
      height: 20px;
    }

    .play-button {
      width: 36px;
      height: 36px;
      color: #111217;
    }

    .play-button svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      stroke: none;
      margin-left: 2px;
    }

    .speed-button {
      min-width: 38px;
      padding: 0 9px;
      color: #2b2c31;
      font-size: 13px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .symbol-a {
      font-size: 18px;
      font-weight: 500;
      line-height: 1;
      transform: translateY(-1px);
    }

    @media (max-width: 1100px) {
      body {
        padding: 18px;
      }

      .window {
        width: calc(100vw - 36px);
      }

      .topbar {
        grid-template-columns: 92px minmax(360px, 1fr) 92px;
      }

      .toolbar-status,
      .volume,
      .utility .optional {
        display: none;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .control-row {
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "source tools"
          "transport transport";
        gap: 4px 12px;
        padding-bottom: 10px;
      }

      .bottom-player {
        grid-template-rows: 24px auto;
      }

      .now-playing {
        grid-area: source;
      }

      .transport {
        grid-area: transport;
      }

      .utility {
        grid-area: tools;
      }
    }

    @media (max-width: 760px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .traffic,
      .toolbar-status {
        display: none;
      }
    }
  </style>
</head>

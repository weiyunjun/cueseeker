<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CueSeeker Test3 Aligned Workbench Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --desktop: #d8d5d0;
      --window: #fbfbfd;
      --toolbar: #f3f3f4;
      --toolbar-border: rgba(0, 0, 0, 0.1);
      --hairline: rgba(0, 0, 0, 0.075);
      --hairline-strong: rgba(0, 0, 0, 0.13);
      --text: #1d1d1f;
      --text-2: #5f6066;
      --text-3: #8b8c92;
      --text-4: #b1b2b7;
      --card: #ffffff;
      --card-hover: #ffffff;
      --selected: rgba(10, 132, 255, 0.1);
      --selected-border: rgba(10, 132, 255, 0.55);
      --accent: #0a84ff;
      --accent-2: #0067d6;
      --highlight: rgba(255, 204, 0, 0.34);
      --highlight-text: #473200;
      --track: rgba(0, 0, 0, 0.10);
      --shadow-window: 0 0 0 0.5px rgba(0, 0, 0, 0.18), 0 24px 60px -8px rgba(0, 0, 0, 0.32), 0 8px 16px -4px rgba(0, 0, 0, 0.2);
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--desktop);
      color: var(--text);
      font-family: var(--sf);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 28px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: default;
    }

    .window {
      width: min(1380px, 100%);
      height: min(900px, calc(100vh - 56px));
      min-height: 700px;
      border: 0.5px solid rgba(0, 0, 0, 0.18);
      border-radius: 10px;
      background: var(--window);
      box-shadow: var(--shadow-window);
      overflow: hidden;
      display: grid;
      grid-template-rows: 52px minmax(0, 1fr) auto;
    }

    .toolbar {
      background: var(--toolbar);
      border-bottom: 0.5px solid var(--toolbar-border);
      box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.65);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 14px;
    }

    .traffic {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .traffic span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.4), inset 0 0 0 0.5px rgba(0, 0, 0, 0.08);
    }

    .close { background: #ff5f57; }
    .minimize { background: #febc2e; }
    .zoom { background: #28c840; }

    .toolbar-center {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tool-button,
    .icon-button,
    .speed-button {
      appearance: none;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: rgba(0, 0, 0, 0.72);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 80ms ease;
    }

    .tool-button {
      width: 28px;
      height: 24px;
    }

    .tool-button:hover,
    .icon-button:hover,
    .speed-button:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .tool-button.selected,
    .icon-button.selected {
      background: rgba(0, 0, 0, 0.08);
    }

    .search-field {
      height: 28px;
      min-width: 360px;
      max-width: 520px;
      flex: 0 1 460px;
      margin-left: 8px;
      padding: 0 7px 0 9px;
      border: 0.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 7px;
      background: #fff;
      box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.5), 0 0.5px 0 rgba(0, 0, 0, 0.03);
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
    }

    .search-field:focus-within {
      border-color: rgba(10, 132, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.18), inset 0 0.5px 0 rgba(255, 255, 255, 0.5);
    }

    .search-field svg {
      color: rgba(0, 0, 0, 0.42);
      flex: 0 0 auto;
    }

    .search-field input {
      min-width: 0;
      flex: 1;
      height: 24px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 13.5px;
      letter-spacing: 0;
    }

    .clear-button {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      color: rgba(0, 0, 0, 0.45);
      display: inline-flex;
      align-items: center;
    }

    .main {
      min-height: 0;
      overflow: hidden;
      position: relative;
      background: var(--window);
    }

    .search-state,
    .video-state {
      position: absolute;
      inset: 0;
      min-height: 0;
      transition: opacity 140ms ease;
    }

    .video-state {
      display: grid;
      grid-template-columns: 1fr 360px;
      background: #050506;
      opacity: 0;
      pointer-events: none;
    }

    .window.video-expanded .search-state {
      opacity: 0;
      pointer-events: none;
    }

    .window.video-expanded .video-state {
      opacity: 1;
      pointer-events: auto;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 6px;
      background: var(--window);
    }

    .results-header .summary {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      color: var(--text-2);
      font-size: 12.5px;
    }

    .results-header strong {
      color: var(--text);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .header-actions {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }

    .small-button {
      height: 22px;
      padding: 0 9px;
      border: 0.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 5px;
      background: transparent;
      color: var(--text-2);
      font-size: 11.5px;
    }

    .small-button:hover {
      background: rgba(0, 0, 0, 0.04);
    }

    .results-scroll {
      position: absolute;
      left: 0;
      right: 0;
      top: 50px;
      bottom: 0;
      overflow: auto;
      padding: 4px 20px 24px;
      background: var(--window);
    }

    .group {
      padding: 14px 0 4px;
      border-bottom: 0.5px solid var(--hairline);
      margin-bottom: 4px;
    }

    .group:last-child {
      border-bottom: 0;
    }

    .group-header {
      appearance: none;
      border: 0;
      width: calc(100% + 12px);
      margin: 0 -6px;
      padding: 4px 6px 4px 4px;
      border-radius: 5px;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
    }

    .group-header:hover {
      background: rgba(0, 0, 0, 0.035);
    }

    .group-header .chevron {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-3);
      transition: transform 140ms ease;
    }

    .group-header .chevron {
      transform: rotate(90deg);
    }

    .group.collapsed .chevron {
      transform: rotate(0deg);
    }

    .group-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.005em;
    }

    .group-count {
      color: var(--text-3);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 14px;
    }

    .group.collapsed .cards {
      display: none;
    }

    .result-card {
      appearance: none;
      border-radius: 6px;
      border: 0.5px solid rgba(0, 0, 0, 0.12);
      background: var(--card);
      color: var(--text);
      text-align: left;
      transition: background 80ms ease, border-color 80ms ease, box-shadow 80ms ease;
      user-select: text;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .result-card:hover {
      background: var(--card-hover);
    }

    .result-card.selected {
      background: var(--selected);
      border-color: var(--selected-border);
      box-shadow: 0 0 0 0.5px rgba(10, 132, 255, 0.35);
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-3);
      font: 11px var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      margin-bottom: 1px;
    }

    .result-card.selected .meta,
    .sidebar-row.selected .meta {
      color: var(--accent-2);
      font-weight: 600;
    }

    .rank {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .playing {
      color: var(--accent);
      display: none;
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
    }

    .selected .playing {
      display: inline-flex;
    }

    .line {
      color: var(--text);
      font-size: 13.5px;
      font-weight: 450;
      line-height: 1.4;
      letter-spacing: 0;
      opacity: 0.88;
      text-wrap: pretty;
    }

    .selected .line {
      color: #0b1220;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.003em;
      opacity: 1;
    }

    mark {
      background: var(--highlight);
      color: var(--highlight-text);
      padding: 1px 2px;
      border-radius: 2px;
      font: inherit;
    }

    .video-stage {
      position: relative;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(135deg, #101013 0 14px, #0b0b0d 14px 28px);
      opacity: 0.82;
    }

    .video-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(42, 42, 52, 0.42), rgba(0, 0, 0, 0.95));
    }

    .video-label {
      position: relative;
      z-index: 1;
      color: rgba(255, 255, 255, 0.35);
      font: 11px var(--mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .subtitle-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 6%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 0 8%;
      text-align: center;
      pointer-events: none;
    }

    .subtitle-overlay .overlay-line {
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.005em;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85), 0 0 12px rgba(0, 0, 0, 0.55);
    }

    .sidebar {
      border-left: 0.5px solid var(--hairline-strong);
      background: var(--window);
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .sidebar-top {
      padding: 12px 14px 8px;
      border-bottom: 0.5px solid var(--hairline);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px;
      padding: 2px;
      width: 100%;
      border: 0.5px solid rgba(0, 0, 0, 0.08);
      border-radius: 7px;
      background: rgba(0, 0, 0, 0.06);
    }

    .segmented button {
      height: 22px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.003em;
    }

    .segmented button.active {
      background: #fff;
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 0.5px 0 rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .sidebar-summary {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      color: var(--text-3);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
    }

    .sidebar-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 6px 0;
    }

    .sidebar-row {
      appearance: none;
      margin: 2px 8px;
      width: calc(100% - 16px);
      padding: 8px 10px;
      border-radius: 6px;
      border: 0.5px solid transparent;
      background: transparent;
      color: var(--text);
      text-align: left;
      transition: background 80ms ease, border-color 80ms ease, box-shadow 80ms ease;
      user-select: text;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-row:hover {
      background: rgba(0, 0, 0, 0.04);
    }

    .sidebar-row.selected {
      background: var(--selected);
      border-color: var(--selected-border);
      box-shadow: 0 0 0 0.5px rgba(10, 132, 255, 0.35);
    }

    .sidebar-row .line {
      font-size: 12.5px;
    }

    .sidebar-row.selected .line {
      font-size: 13px;
      font-weight: 600;
    }

    .player {
      background: linear-gradient(180deg, #f2f2f3 0%, #ededee 100%);
      border-top: 0.5px solid rgba(0, 0, 0, 0.12);
      box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.7);
      color: var(--text);
    }

    .scrubber-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px 4px;
    }

    .time {
      width: 38px;
      color: var(--text-2);
      font: 11px var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .time.end {
      color: var(--text-3);
      text-align: right;
    }

    .slider {
      --value: 0%;
      position: relative;
      height: 14px;
      display: flex;
      align-items: center;
      flex: 1;
    }

    .slider::before,
    .slider::after {
      content: "";
      position: absolute;
      left: 0;
      height: 3px;
      border-radius: 2px;
    }

    .slider::before {
      right: 0;
      background: var(--track);
    }

    .slider::after {
      width: var(--value);
      background: var(--accent);
    }

    .thumb {
      position: absolute;
      left: calc(var(--value) - 6px);
      z-index: 1;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.18), 0 1px 2px rgba(0, 0, 0, 0.18);
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 18px 10px;
    }

    .source-toggle {
      appearance: none;
      max-width: 260px;
      height: 26px;
      padding: 0 10px 0 8px;
      border: 0.5px solid rgba(0, 0, 0, 0.1);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.035);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 80ms ease;
    }

    .source-toggle:hover {
      background: rgba(0, 0, 0, 0.06);
    }

    .source-toggle .source-chevron {
      color: var(--text-2);
      display: inline-flex;
      transition: transform 160ms ease;
    }

    .window.video-expanded .source-toggle .source-chevron {
      transform: rotate(180deg);
    }

    .source-label {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: -0.005em;
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 14px;
      color: var(--text-2);
    }

    .volume .slider {
      width: 90px;
      flex: 0 0 90px;
    }

    .volume .thumb {
      width: 10px;
      height: 10px;
      left: calc(var(--value) - 5px);
    }

    .spacer {
      flex: 1;
    }

    .transport,
    .tools {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-button {
      width: 28px;
      height: 24px;
    }

    .icon-button.play {
      width: 32px;
      height: 26px;
    }

    .speed-button {
      min-width: 36px;
      height: 24px;
      padding: 0 8px;
      color: var(--text);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .speed-control {
      position: relative;
      display: inline-flex;
    }

    .speed-button[aria-expanded="true"] {
      background: rgba(0, 0, 0, 0.08);
    }

    .speed-menu {
      position: absolute;
      right: -4px;
      bottom: calc(100% + 6px);
      z-index: 10;
      width: 108px;
      padding: 4px;
      border: 0.5px solid rgba(0, 0, 0, 0.16);
      border-radius: 7px;
      background: rgba(246, 246, 247, 0.94);
      box-shadow: 0 12px 28px -20px rgba(0, 0, 0, 0.52), 0 2px 7px rgba(0, 0, 0, 0.16), inset 0 0.5px 0 rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(18px);
    }

    .speed-option {
      appearance: none;
      width: 100%;
      height: 23px;
      padding: 0 8px 0 6px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--text);
      display: grid;
      grid-template-columns: 16px 1fr;
      column-gap: 4px;
      align-items: center;
      font-size: 12.5px;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      text-align: left;
    }

    .speed-option:hover,
    .speed-option:focus-visible {
      outline: 0;
      background: var(--accent);
      color: #fff;
    }

    .speed-option.selected {
      background: transparent;
      color: var(--text);
      font-weight: 400;
    }

    .speed-option.selected:hover,
    .speed-option.selected:focus-visible {
      background: var(--accent);
      color: #fff;
    }

    .speed-check {
      color: var(--accent);
      font-size: 11px;
      text-align: center;
      opacity: 0;
    }

    .speed-option:hover .speed-check,
    .speed-option:focus-visible .speed-check {
      color: currentColor;
    }

    .speed-option.selected .speed-check {
      opacity: 1;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 980px) {
      body {
        padding: 14px;
      }

      .window {
        height: calc(100vh - 28px);
      }

      .search-field {
        min-width: 240px;
      }

      .video-state {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .volume,
      .tools .optional {
        display: none;
      }
    }

  </style>
</head>

            <button class="sidebar-row" type="button" data-rank="18" data-time="05:18" data-zh="灯 你没事吧" data-ja="灯 大丈夫">
              <span class="meta"><span class="rank"><svg class="playing"><use href="#play-glyph"></use></svg>#18</span><span>05:18</span></span>
              <span class="line">灯 你没事吧</span>
              <span class="line">灯 <mark>大丈夫</mark></span>
            </button>
            <button class="sidebar-row" type="button" data-rank="19" data-time="16:44" data-zh="我没事 真的" data-ja="大丈夫だよ ホントに">
              <span class="meta"><span class="rank"><svg class="playing"><use href="#play-glyph"></use></svg>#19</span><span>16:44</span></span>
              <span class="line">我没事 真的</span>
              <span class="line"><mark>大丈夫</mark>だよ ホントに</span>
            </button>
          </div>
        </aside>
      </section>
    </section>

    <footer class="player" aria-label="Bottom player">
      <div class="scrubber-row">
        <span class="time">00:30</span>
        <div class="slider" style="--value: 2.1%;">
          <span class="thumb"></span>
        </div>
        <span class="time end">23:41</span>
      </div>
      <div class="player-row">
        <button class="source-toggle" type="button" id="sourceToggle" aria-pressed="false" aria-label="Expand video">
          <span class="source-chevron"><svg width="11" height="11"><use href="#chev-up"></use></svg></span>
          <span class="source-label">Ave Mujica - 01</span>
        </button>
        <div class="volume">
          <svg width="14" height="14"><use href="#speaker"></use></svg>
          <div class="slider" style="--value: 36%;">
            <span class="thumb"></span>
          </div>
        </div>

        <span class="spacer"></span>
        <div class="transport">
          <button class="icon-button" type="button" aria-label="Previous episode"><svg width="13" height="13"><use href="#step-back"></use></svg></button>
          <button class="icon-button" type="button" aria-label="Previous result"><svg width="14" height="14"><use href="#play-back"></use></svg></button>
          <button class="icon-button play" type="button" aria-label="Play"><svg width="14" height="14"><use href="#play"></use></svg></button>
          <button class="icon-button" type="button" aria-label="Next result"><svg width="14" height="14"><use href="#play-forward"></use></svg></button>
          <button class="icon-button" type="button" aria-label="Next episode"><svg width="13" height="13"><use href="#step-fwd"></use></svg></button>
        </div>
        <span class="spacer"></span>

        <div class="tools">
          <button class="icon-button" type="button" aria-label="Save cue"><svg width="17" height="17"><use href="#bookmark"></use></svg></button>
          <button class="icon-button optional" type="button" aria-label="Typography">Aa</button>
          <button class="icon-button optional" type="button" aria-label="Subtitles"><svg width="14" height="14"><use href="#caption"></use></svg></button>
          <button class="icon-button selected" type="button" aria-label="Results panel"><svg width="14" height="14"><use href="#list"></use></svg></button>
          <div class="speed-control">
            <button class="speed-button" type="button" id="speedButton" aria-label="Playback speed" aria-haspopup="menu" aria-expanded="false">1×</button>
            <div class="speed-menu" id="speedMenu" role="menu" aria-label="Playback speed" hidden>
              <button class="speed-option" type="button" role="menuitemradio" aria-checked="false" data-speed="0.5×"><span>0.5×</span><span class="speed-check" aria-hidden="true">✓</span></button>
              <button class="speed-option" type="button" role="menuitemradio" aria-checked="false" data-speed="0.75×"><span>0.75×</span><span class="speed-check" aria-hidden="true">✓</span></button>
              <button class="speed-option selected" type="button" role="menuitemradio" aria-checked="true" data-speed="1×"><span>1×</span><span class="speed-check" aria-hidden="true">✓</span></button>
              <button class="speed-option" type="button" role="menuitemradio" aria-checked="false" data-speed="1.25×"><span>1.25×</span><span class="speed-check" aria-hidden="true">✓</span></button>
              <button class="speed-option" type="button" role="menuitemradio" aria-checked="false" data-speed="1.5×"><span>1.5×</span><span class="speed-check" aria-hidden="true">✓</span></button>
              <button class="speed-option" type="button" role="menuitemradio" aria-checked="false" data-speed="2×"><span>2×</span><span class="speed-check" aria-hidden="true">✓</span></button>
            </div>
          </div>
          <button class="icon-button" type="button" aria-label="Fullscreen"><svg width="13" height="13"><use href="#expand"></use></svg></button>
        </div>
      </div>
    </footer>
  </main>

  <script>
    const win = document.getElementById("window");
    const sourceToggle = document.getElementById("sourceToggle");
    const currentZh = document.querySelector("[data-current-zh]");
    const currentJa = document.querySelector("[data-current-ja]");
    const searchInput = document.getElementById("searchInput");
    const clearSearch = document.getElementById("clearSearch");
    const sidebarCount = document.getElementById("sidebarCount");
    const speedButton = document.getElementById("speedButton");
    const speedMenu = document.getElementById("speedMenu");

    function escapeHTML(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function highlight(value, query) {
      if (!query) {
        return escapeHTML(value);
      }
      const index = value.indexOf(query);
      if (index === -1) {
        return escapeHTML(value);
      }
      return [
        escapeHTML(value.slice(0, index)),
        "<mark>",
        escapeHTML(value.slice(index, index + query.length)),
        "</mark>",
        highlight(value.slice(index + query.length), query)
      ].join("");
    }

    function updateSearch(query) {
      document.querySelectorAll(".result-card, .sidebar-row").forEach((el) => {
        const matches = !query || el.dataset.zh.includes(query) || el.dataset.ja.includes(query);
        el.hidden = !matches;
        const lines = el.querySelectorAll(".line");
        lines[0].innerHTML = highlight(el.dataset.zh, query);
        lines[1].innerHTML = highlight(el.dataset.ja, query);
      });

      document.querySelectorAll(".group").forEach((group) => {
        const visibleCards = Array.from(group.querySelectorAll(".result-card")).filter((card) => !card.hidden);
        group.hidden = visibleCards.length === 0;
        const count = group.querySelector(".group-count");
        count.textContent = `${visibleCards.length} ${visibleCards.length === 1 ? "result" : "results"}`;
      });

      updateSidebarSummary();
    }

    function updateSidebarSummary() {
      const activeTab = document.querySelector(".segmented button.active")?.dataset.tab;
      if (activeTab === "subs") {
        sidebarCount.textContent = "317 cues";
      } else {
        sidebarCount.textContent = "Found 185 results in 74 files";
      }
    }

    function selectRank(rank, time, zh, ja) {
      document.querySelectorAll(".result-card, .sidebar-row").forEach((el) => {
        el.classList.toggle("selected", el.dataset.rank === rank);
      });
      currentZh.textContent = zh;
      currentJa.textContent = ja;
    }

    document.querySelectorAll(".result-card, .sidebar-row").forEach((el) => {
      el.addEventListener("click", () => {
        selectRank(el.dataset.rank, el.dataset.time, el.dataset.zh, el.dataset.ja);
      });
    });

    searchInput.addEventListener("input", () => {
      updateSearch(searchInput.value);
    });

    clearSearch.addEventListener("click", () => {
      searchInput.value = "";
      updateSearch("");
      searchInput.focus();
    });

    document.querySelectorAll(".group-header").forEach((button) => {
      button.addEventListener("click", () => {
        button.closest(".group").classList.toggle("collapsed");
      });
    });

    document.querySelector("[data-action='collapse-all']").addEventListener("click", () => {
      document.querySelectorAll(".group").forEach((group) => group.classList.add("collapsed"));
    });

    sourceToggle.addEventListener("click", () => {
      const expanded = !win.classList.contains("video-expanded");
      win.classList.toggle("video-expanded", expanded);
      sourceToggle.setAttribute("aria-pressed", String(expanded));
      sourceToggle.setAttribute("aria-label", expanded ? "Collapse video" : "Expand video");
    });

    document.querySelectorAll(".segmented button").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".segmented button").forEach((item) => {
          item.classList.toggle("active", item === button);
        });
        updateSidebarSummary();
      });
    });

    function setSpeedMenuOpen(open) {
      speedMenu.hidden = !open;
      speedButton.setAttribute("aria-expanded", String(open));
    }

    speedButton.addEventListener("click", (event) => {
      event.stopPropagation();
      setSpeedMenuOpen(speedMenu.hidden);
    });

    document.querySelectorAll(".speed-option").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".speed-option").forEach((item) => {
          const selected = item === button;
          item.classList.toggle("selected", selected);
          item.setAttribute("aria-checked", String(selected));
        });
        speedButton.textContent = button.dataset.speed;
        setSpeedMenuOpen(false);
      });
    });

    document.addEventListener("click", (event) => {
      if (!speedMenu.hidden && !event.target.closest(".speed-control")) {
        setSpeedMenuOpen(false);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        setSpeedMenuOpen(false);
      }
    });

    updateSearch(searchInput.value);
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CueSeeker macOS Native Bottom Player Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --window: #fbfbfc;
      --workspace: #ffffff;
      --chrome: rgba(246, 246, 248, 0.9);
      --chrome-solid: #f6f6f8;
      --hairline: rgba(0, 0, 0, 0.14);
      --hairline-soft: rgba(0, 0, 0, 0.08);
      --text: #1f2024;
      --secondary: #6f7076;
      --tertiary: #9b9ca2;
      --control-hover: rgba(0, 0, 0, 0.055);
      --control-pressed: rgba(0, 0, 0, 0.1);
      --control-selected: rgba(0, 0, 0, 0.12);
      --accent: #0a84ff;
      --track: rgba(0, 0, 0, 0.13);
      --track-buffered: rgba(0, 0, 0, 0.08);
      --shadow: rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #f8f8f9 0%, #f0f0f2 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 36px;
    }

    button {
      font: inherit;
    }

    .window {
      width: min(1520px, calc(100vw - 72px));
      height: min(720px, calc(100vh - 72px));
      min-height: 520px;
      border: 1px solid var(--hairline);
      border-radius: 18px;
      background: var(--window);
      box-shadow: 0 22px 68px var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }

    .workspace {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(250, 250, 251, 0.96)),
        var(--workspace);
      min-height: 0;
    }

    .bottom-player {
      min-width: 0;
      background: var(--chrome);
      border-top: 1px solid var(--hairline);
      backdrop-filter: saturate(1.8) blur(18px);
      -webkit-backdrop-filter: saturate(1.8) blur(18px);
      display: grid;
      grid-template-rows: 24px 54px;
      color: var(--text);
    }

    .scrubber-row {
      min-width: 0;
      display: grid;
      grid-template-columns: 54px minmax(120px, 1fr) 54px;
      align-items: center;
      gap: 12px;
      padding: 8px 24px 0;
      color: var(--secondary);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .time {
      white-space: nowrap;
    }

    .time.end {
      text-align: right;
    }

    .timeline {
      height: 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      padding: 0;
      position: relative;
      cursor: pointer;
    }

    .timeline::before,
    .timeline::after,
    .timeline .played {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      height: 3px;
      border-radius: 999px;
      transform: translateY(-50%);
    }

    .timeline::before {
      right: 0;
      background: var(--track);
    }

    .timeline::after {
      width: 78%;
      background: var(--track-buffered);
    }

    .timeline .played {
      width: 62%;
      background: var(--accent);
      z-index: 1;
    }

    .timeline .thumb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.18);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
      position: absolute;
      left: 62%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      opacity: 0.72;
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .timeline:hover .thumb,
    .timeline:focus-visible .thumb {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.1);
    }

    .timeline:hover::before,
    .timeline:focus-visible::before,
    .timeline:hover .played,
    .timeline:focus-visible .played {
      height: 4px;
    }

    .control-row {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(300px, 1fr) auto minmax(300px, 1fr);
      align-items: center;
      gap: 20px;
      padding: 0 22px 8px;
    }

    .now-playing,
    .transport,
    .utility {
      min-width: 0;
      display: flex;
      align-items: center;
    }

    .now-playing {
      gap: 10px;
    }

    .transport {
      justify-content: center;
      gap: 7px;
      color: #28292e;
    }

    .utility {
      justify-content: flex-end;
      gap: 6px;
      color: #303137;
    }

    .source-title {
      min-width: 0;
      max-width: 330px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .volume {
      margin-left: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--secondary);
    }

    .volume-meter {
      width: 76px;
      height: 3px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.13);
      position: relative;
    }

    .volume-meter::before {
      content: "";
      position: absolute;
      inset: 0 34% 0 0;
      border-radius: inherit;
      background: rgba(0, 0, 0, 0.42);
    }

    .divider {
      width: 1px;
      height: 22px;
      background: var(--hairline-soft);
      margin: 0 5px;
      flex: 0 0 auto;
    }

    .icon-button,
    .speed-button {
      appearance: none;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: inherit;
      height: 30px;
      min-width: 30px;
      padding: 0;
      display: grid;
      place-items: center;
      transition: background 110ms ease, color 110ms ease;
    }

    .icon-button:hover,
    .speed-button:hover {
      background: var(--control-hover);
    }

    .icon-button:active,
    .speed-button:active {
      background: var(--control-pressed);
    }

    .icon-button:focus-visible,
    .speed-button:focus-visible,
    .timeline:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 28%, transparent);
      outline-offset: 2px;
    }

    .icon-button.selected {
      background: var(--control-selected);
    }

    .icon-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-button.compact svg {
      width: 17px;
      height: 17px;
    }

    .transport .icon-button {
      width: 32px;
      height: 32px;
    }

    .transport .icon-button svg {
      width: 20px;
      height: 20px;
    }

    .play-button {
      width: 36px;
      height: 36px;
      color: #111217;
    }

    .play-button svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      stroke: none;
      margin-left: 2px;
    }

    .speed-button {
      min-width: 38px;
      padding: 0 9px;
      color: #2b2c31;
      font-size: 13px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .utility .icon-button svg {
      width: 18px;
      height: 18px;
    }

    .symbol-a {
      font-size: 18px;
      font-weight: 500;
      line-height: 1;
      transform: translateY(-1px);
    }

    @media (max-width: 980px) {
      body {
        padding: 18px;
      }

      .window {
        width: calc(100vw - 36px);
      }

      .control-row {
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "source tools"
          "transport transport";
        gap: 4px 12px;
        padding-bottom: 10px;
      }

      .bottom-player {
        grid-template-rows: 24px auto;
      }

      .now-playing {
        grid-area: source;
      }

      .transport {
        grid-area: transport;
      }

      .utility {
        grid-area: tools;
      }

      .volume,
      .utility .optional {
        display: none;
      }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <symbol id="icon-chevron-up" viewBox="0 0 24 24">
      <path d="m6 14 6-6 6 6"></path>
    </symbol>
    <symbol id="icon-speaker" viewBox="0 0 24 24">
      <path d="M4 9v6h4l5 4V5L8 9H4Z"></path>
      <path d="M16 9.5c1.2 1.4 1.2 3.6 0 5"></path>
      <path d="M18.4 7c2.2 2.8 2.2 7.2 0 10"></path>
    </symbol>
    <symbol id="icon-skip-back" viewBox="0 0 24 24">
      <path d="M6 5v14"></path>
      <path d="m18 6-9 6 9 6V6Z"></path>
    </symbol>
    <symbol id="icon-step-back" viewBox="0 0 24 24">
      <path d="m15 6-7 6 7 6"></path>
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path d="M8 5.5v13l10-6.5L8 5.5Z"></path>
    </symbol>
    <symbol id="icon-step-forward" viewBox="0 0 24 24">
      <path d="m9 6 7 6-7 6"></path>
    </symbol>
    <symbol id="icon-skip-forward" viewBox="0 0 24 24">
      <path d="M18 5v14"></path>
      <path d="m6 6 9 6-9 6V6Z"></path>
    </symbol>
    <symbol id="icon-bookmark" viewBox="0 0 24 24">
      <path d="M7 5.5c0-.8.7-1.5 1.5-1.5h7c.8 0 1.5.7 1.5 1.5v14L12 16l-5 3.5v-14Z"></path>
    </symbol>
    <symbol id="icon-caption" viewBox="0 0 24 24">
      <path d="M5 7.5C5 6.7 5.7 6 6.5 6h11c.8 0 1.5.7 1.5 1.5v8c0 .8-.7 1.5-1.5 1.5h-11c-.8 0-1.5-.7-1.5-1.5v-8Z"></path>
      <path d="M8 10h3"></path>
      <path d="M13 10h3"></path>
      <path d="M8 14h5"></path>
    </symbol>
    <symbol id="icon-list" viewBox="0 0 24 24">
      <path d="M9 7h10"></path>
      <path d="M9 12h10"></path>
      <path d="M9 17h10"></path>
      <path d="M5 7h.01"></path>
      <path d="M5 12h.01"></path>
      <path d="M5 17h.01"></path>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <path d="M7 8.5C7 7.7 7.7 7 8.5 7h7c.8 0 1.5.7 1.5 1.5v5c0 .8-.7 1.5-1.5 1.5H12l-3.5 3v-3C7.7 15 7 14.3 7 13.5v-5Z"></path>
      <path d="M10 10.5h4"></path>
      <path d="M10 13h3"></path>
    </symbol>
    <symbol id="icon-expand" viewBox="0 0 24 24">
      <path d="M8 4H4v4"></path>
      <path d="M4 4l6 6"></path>
      <path d="M16 4h4v4"></path>
      <path d="m20 4-6 6"></path>
      <path d="M8 20H4v-4"></path>
      <path d="m4 20 6-6"></path>
      <path d="M16 20h4v-4"></path>
      <path d="m20 20-6-6"></path>
    </symbol>
  </svg>

  <main class="window" aria-label="CueSeeker macOS native bottom player prototype">
    <section class="workspace" aria-label="Main work area preview"></section>

    <footer class="bottom-player" aria-label="Bottom player">
      <div class="scrubber-row">
        <span class="time">17:20</span>
        <button class="timeline" type="button" role="slider" aria-label="Playback position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62">
          <span class="played"></span>
          <span class="thumb"></span>
        </button>
        <span class="time end">24:31</span>
      </div>

      <div class="control-row">
        <section class="now-playing" aria-label="Current source">
          <button class="icon-button compact" type="button" aria-label="Expand video">
            <svg><use href="#icon-chevron-up"></use></svg>
          </button>
          <span class="source-title">葬送的芙莉莲 - 18</span>
          <span class="divider" aria-hidden="true"></span>
          <div class="volume" aria-label="Volume">
            <button class="icon-button compact" type="button" aria-label="Mute">
              <svg><use href="#icon-speaker"></use></svg>
            </button>
            <span class="volume-meter" aria-hidden="true"></span>
          </div>
        </section>

        <section class="transport" aria-label="Playback controls">
          <button class="icon-button" type="button" aria-label="Previous episode">
            <svg><use href="#icon-skip-back"></use></svg>
          </button>
          <button class="icon-button" type="button" aria-label="Previous result">
            <svg><use href="#icon-step-back"></use></svg>
          </button>
          <button class="icon-button play-button" type="button" aria-label="Play">
            <svg><use href="#icon-play"></use></svg>
          </button>
          <button class="icon-button" type="button" aria-label="Next result">
            <svg><use href="#icon-step-forward"></use></svg>
          </button>
          <button class="icon-button" type="button" aria-label="Next episode">
            <svg><use href="#icon-skip-forward"></use></svg>
          </button>
        </section>

        <section class="utility" aria-label="Playback utilities">
          <button class="icon-button" type="button" aria-label="Save cue">
            <svg><use href="#icon-bookmark"></use></svg>
          </button>
          <button class="icon-button optional" type="button" aria-label="Text options">
            <span class="symbol-a" aria-hidden="true">A</span>
          </button>
          <button class="icon-button optional" type="button" aria-label="Copy current subtitle">
            <svg><use href="#icon-copy"></use></svg>
          </button>
          <button class="icon-button selected" type="button" aria-label="Show subtitle panel">
            <svg><use href="#icon-list"></use></svg>
          </button>
          <span class="divider" aria-hidden="true"></span>
          <button class="speed-button" type="button" aria-label="Playback speed">1x</button>
          <span class="divider" aria-hidden="true"></span>
          <button class="icon-button" type="button" aria-label="Fullscreen">
            <svg><use href="#icon-expand"></use></svg>
          </button>
        </section>
      </div>
    </footer>
  </main>
</body>
</html>
